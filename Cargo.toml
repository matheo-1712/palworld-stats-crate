[package]
name = "palworld-stats"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
oozextract = "0.5.5"
flate2 = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
log = "0.4"

[features]
pocketbase = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
